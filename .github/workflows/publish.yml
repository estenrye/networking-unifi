name: PyPI Publish

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:

  # schedule:
  #   - cron: "0 0 * * *" # every day at midnight UTC

  # pull_request:
  #   branches:
  #     - main

jobs:
  build-sdist:
    runs-on: ubuntu-latest

    concurrency:
      group: build-sdist

    steps:
      - uses: actions/checkout@v4

      - name: Install poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "poetry"

      - name: build release distributions
        run: |-
          poetry self add poetry-git-version-plugin
          poetry git-version
          poetry build --format=wheel
          poetry build --format=sdist
        # `poetry install` deliberately removed: this fork's whole point is
        # requires-python relaxed to >=3.10.12 while its own dependency
        # aiohttp-unifi still declares >=3.12.0 (see README/pyproject.toml).
        # Poetry's dependency solver enforces that overlap strictly and
        # refuses to lock or install this graph at all -- pip's
        # --ignore-requires-python (used by neutron-ml2-guardian's own
        # install/download commands) has no poetry equivalent. `poetry
        # build` needs no lock file or installed environment, only
        # pyproject.toml, so it's unaffected -- there is no poetry.lock in
        # this repo for exactly this reason.

      - name: upload dists
        uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/
          # path: dist/*.tar.gz

          # build-wheels:
          #   name: Build wheels for ${{ matrix.os }}
          #   runs-on: ${{ matrix.runs-on }}
          #   strategy:
          #     matrix:
          #       os: [linux-intel, linux-arm, macOS-arm]
          #       include:
          #       - archs: auto
          #         platform: auto
          #       - os: linux-intel
          #         runs-on: ubuntu-latest
          #       - os: linux-arm
          #         runs-on: ubuntu-24.04-arm
          #       - os: macos-arm
          #         runs-on: macos-latest
          #         archs: auto,universal2

          #   steps:
          #   - uses: actions/checkout@v4

          #   - name: Build wheels
          #     uses: pypa/cibuildwheel@v2.23.2
          #     env:
          #       CIBW_PLATFORM: ${{ matrix.platform }}
          #       CIBW_ARCHS: ${{ matrix.archs }}

          #   - uses: actions/upload-artifact@v4
          #     with:
          #       name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          #       path: ./wheelhouse/*.whl

  pypi-publish:
    runs-on: ubuntu-latest

    concurrency:
      group: pypi-publish
      cancel-in-progress: false

    needs:
      - build-sdist
    # - build-wheels

    permissions:
      id-token: write

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.12.4
