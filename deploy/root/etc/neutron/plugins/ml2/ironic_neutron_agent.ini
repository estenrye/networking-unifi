[DEFAULT]
# Configuration for ironic neutron agent

# Host which ironic-neutron-agent agent is running on.
# If not provided, ironic-neutron-agent can obtain the hostname.
# host =

# The working mode for the agent. Allowed modes are:
# - 'baremetal' for interactions with the Bare Metal service.
# mode = baremetal

[agent]
# Agent's polling interval in seconds
# polling_interval = 2

# Agent's report interval in seconds
# report_interval = 30

[ironic]
# Ironic endpoint URL for requests for this driver.
# auth_type = password
# auth_url = http://localhost:5000/v3
# username = ironic
# password = password
# project_name = service
# user_domain_name = default
# project_domain_name = default

# For testing, we'll disable auth
auth_type = none
endpoint_override = http://localhost:6385
