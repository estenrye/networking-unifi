version: "3.8"

services:
  mariadb:
    image: mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: neutron_db
      MYSQL_USER: neutron_user
      MYSQL_PASSWORD: neutron_password
    networks:
      - neutron

  neutron:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NEUTRON_USE_MARIADB: true
      MARIADB_HOST: mariadb
      MARIADB_DATABASE: neutron_db
      MARIADB_USER: neutron_user
      MARIADB_PASSWORD: neutron_password
    depends_on:
      - mariadb
    networks:
      - neutron
    ports:
      - "9696:9696"

networks:
  neutron:
    driver: bridge
