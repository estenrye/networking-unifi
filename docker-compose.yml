version: "3.8"

services:
  mariadb:
    image: mariadb:latest
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: neutron_db
      MYSQL_USER: neutron_user
      MYSQL_PASSWORD: neutron_password
    networks:
      - neutron

  neutron:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NEUTRON_USE_MARIADB: true
      MARIADB_HOST: mariadb
      MARIADB_DATABASE: neutron_db
      MARIADB_USER: neutron_user
      MARIADB_PASSWORD: neutron_password
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - neutron
    ports:
      - "9696:9696"

networks:
  neutron:
    driver: bridge
